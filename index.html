<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIMIC EVENT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Pretendard:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050816;
    color:white;
    font-family:'Pretendard',sans-serif;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at top left,#7f5af0 0%,transparent 30%),
    radial-gradient(circle at bottom right,#2cb67d 0%,transparent 30%);
    opacity:0.15;
    z-index:-2;
}

.grid{
    position:fixed;
    width:100%;
    height:100%;
    background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-1;
}

.container{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.card{
    width:100%;
    max-width:1200px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 0 80px rgba(127,90,240,0.2);
}

.hero{
    padding:100px 60px;
    position:relative;
}

.badge{
    display:inline-block;
    padding:10px 20px;
    border-radius:999px;
    background:rgba(127,90,240,0.15);
    border:1px solid rgba(127,90,240,0.4);
    color:#b8a8ff;
    margin-bottom:30px;
    font-size:14px;
    letter-spacing:2px;
}

h1{
    font-family:'Orbitron',sans-serif;
    font-size:90px;
    line-height:1;
    margin-bottom:20px;
    background:linear-gradient(to right,#ffffff,#7f5af0);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sub{
    color:#9ca3af;
    font-size:22px;
    line-height:1.6;
    max-width:700px;
}

.buttons{
    margin-top:50px;
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.btn{
    padding:18px 35px;
    border-radius:15px;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
    font-size:16px;
}

.primary{
    background:#7f5af0;
    color:white;
    box-shadow:0 0 25px rgba(127,90,240,0.5);
}

.primary:hover{
    transform:translateY(-5px);
    box-shadow:0 0 40px rgba(127,90,240,0.8);
}

.secondary{
    border:1px solid rgba(255,255,255,0.15);
    color:white;
    background:rgba(255,255,255,0.04);
}

.secondary:hover{
    background:rgba(255,255,255,0.08);
    transform:translateY(-5px);
}

.info{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding:0 60px 60px;
}

.box{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:30px;
    transition:0.3s;
}

.box:hover{
    transform:translateY(-10px);
    border-color:#7f5af0;
    box-shadow:0 0 30px rgba(127,90,240,0.2);
}

.box h2{
    margin-bottom:15px;
    font-size:22px;
}

.box p{
    color:#9ca3af;
    line-height:1.7;
}

.footer{
    text-align:center;
    padding:40px;
    border-top:1px solid rgba(255,255,255,0.08);
    color:#6b7280;
}

.glow{
    position:absolute;
    width:400px;
    height:400px;
    background:#7f5af0;
    filter:blur(180px);
    opacity:0.2;
    top:-100px;
    right:-100px;
    z-index:-1;
}

@media(max-width:768px){

    .hero{
        padding:70px 30px;
    }

    h1{
        font-size:55px;
    }

    .sub{
        font-size:18px;
    }

    .info{
        padding:0 30px 30px;
    }

}

</style>
</head>

<body>

<div class="grid"></div>

<div class="container">

    <div class="card">

        <section class="hero">

            <div class="glow"></div>

            <div class="badge">
                PRIVATE EVENT
            </div>

            <h1>
                MIMIC<br>
                PARTY
            </h1>

            <p class="sub">
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Reiciendis, aliquid. Modern cyber styled invitation landing page.
            </p>

            <div class="buttons">

                <a href="#" class="btn primary">
                    JOIN EVENT
                </a>

                <a href="#" class="btn secondary">
                    VIEW DETAILS
                </a>

            </div>

        </section>

        <section class="info">

            <div class="box">
                <h2>DATE</h2>
                <p>
                    2026.06.xx<br>
                    PM 07:00
                </p>
            </div>

            <div class="box">
                <h2>LOCATION</h2>
                <p>
                    Seoul<br>
                    Somewhere Building
                </p>
            </div>

            <div class="box">
                <h2>DRESS CODE</h2>
                <p>
                    Black / Neon<br>
                    Casual Street
                </p>
            </div>

        </section>

        <div class="footer">
            CREATED BY MIMIC
        </div>

    </div>

</div>

</body>
</html>
